# Once a week, ask KITopen for publications of the author that src/data/papers.bib
# does not list yet, and add them as entries.
#
# Only articles and conference papers are added; reports, theses and teaching
# material in KITopen stay out. Add the source id to src/data/papers-ignore.yml
# to keep a record from being proposed again. A new entry gets an `abbr` when its
# venue matches a row in src/data/venues.yml; otherwise it has no badge, and you
# add the venue row and the `abbr` by hand.
#
# The changes go into a pull request on the branch `bibliography-update`, not
# onto the default branch. Merging it publishes them. The repository setting
# "Allow GitHub Actions to create and approve pull requests" must be on, and the
# pull request does not start the build checks, because GITHUB_TOKEN pushes start
# no workflow: run deploy.yml on that branch by hand to check it if you want.
#
# Preprints on arXiv are checked too: when one has a published version (arXiv `doi`
# field or a Crossref title match), its entry becomes that paper. A comment such as
# "accepted at ..." without a DOI is only logged.
#
# KITopen unreachable is not a failure: the script exits 2 without touching any
# file, and the next week's run tries again.
#
# Uses GITHUB_TOKEN, not a PAT. Needs orcid_id in src/data/socials.yml.
name: Update bibliography

on:
  workflow_dispatch:
  schedule:
    - cron: '3 5 * * 1' # Mondays, 05:03 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-bibliography
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO || 'jan.keim@kit.edu' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Find missing papers
        run: |
          set +e
          npm run --silent bib:missing:kitopen -- --yes --only article,inproceedings | tee "$RUNNER_TEMP/missing.log"
          code=${PIPESTATUS[0]}
          # 0: nothing missing. 1: entries added. 2: KITopen unreachable.
          if [ $code -eq 2 ]; then
            echo "::warning::KITopen could not be used; papers.bib is unchanged"
            exit 0
          fi
          [ $code -le 1 ]

      - name: Update arXiv preprints
        run: |
          set +e
          npm run --silent bib:arxiv -- --write
          code=$?
          # 0: nothing found. 1: entries updated or reported. 2: arXiv unreachable.
          if [ $code -eq 2 ]; then
            echo "::warning::arXiv could not be used; preprint entries are unchanged"
            exit 0
          fi
          [ $code -le 1 ]

      - name: Open or update the pull request
        run: |
          if git diff --quiet -- src/data/papers.bib src/data/papers-ignore.yml; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C bibliography-update
          git add src/data/papers.bib
          git commit -m "chore: update the bibliography"
          # The branch belongs to this workflow: each run rebuilds it from the
          # default branch, so an open pull request always shows the full change.
          git push --force origin bibliography-update
          if [ -z "$(gh pr list --head bibliography-update --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head bibliography-update \
              --title "chore: update the bibliography" \
              --body "This pull request adds new publications and updates preprint entries in src/data/papers.bib. Check each entry, especially the venue badge (abbr). Merge to publish the changes."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
