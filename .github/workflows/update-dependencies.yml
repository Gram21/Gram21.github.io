# Once a week, raise the npm dependencies to their latest versions, but only
# keep the result if the site still builds. The checks are the ones deploy.yml
# runs: formatting, type check, generated docs, build, audit.
#
# Only versions at least seven days old are taken, so a freshly published (or
# hijacked) release is not built and deployed unseen: ncu picks the version and
# `npm install --before` stops the lockfile from resolving anything newer. The
# `update` job runs package code with a read-only token and no credentials. The
# `publish` job never runs package code: it takes the two changed files from the
# first job and is the only one that can write.
#
# Two attempts: every update including majors first, then minor and patch
# updates only. If neither passes, nothing is committed and the run says so.
# TypeScript stays out of the first attempt: astro check refuses TypeScript 7
# (see renovate.json).
#
# Uses GITHUB_TOKEN, not a PAT. Its push triggers no other workflow, so the last
# step starts deploy.yml explicitly; if that fails, the scheduled run of
# deploy.yml publishes the commit later the same day.
name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 2' # Tuesdays, 03:23 UTC

permissions:
  contents: read

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Update and verify
        run: |
          set -o pipefail
          verify() {
            npm ci &&
              npx prettier . --check &&
              npx astro check &&
              npm run docs:check &&
              npm run build 2>&1 | tee "$RUNNER_TEMP/build.log" &&
              ! grep -qE 'Invalid content reference|does not exist or is empty' "$RUNNER_TEMP/build.log" &&
              npm run audit
          }
          attempt() {
            git checkout -- package.json package-lock.json
            npx --yes npm-check-updates@23.1.0 --cooldown 7 -u "$@" &&
              npm install --before "$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" &&
              verify
          }
          if attempt --reject typescript; then
            echo "Updated all dependencies."
          elif attempt --target minor; then
            echo "Updated minor and patch versions; at least one major update breaks the build."
          else
            git checkout -- package.json package-lock.json
            echo "::warning::no dependency update passed the checks; nothing was changed"
          fi

      - name: Keep the result for the publish job
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No change."
            exit 0
          fi
          mkdir "$RUNNER_TEMP/out"
          cp package.json package-lock.json "$RUNNER_TEMP/out/"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        id: result

      - uses: actions/upload-artifact@v7
        if: steps.result.outputs.changed == 'true'
        with:
          name: dependency-update
          path: ${{ runner.temp }}/out

    outputs:
      changed: ${{ steps.result.outputs.changed }}

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dependency-update

      - name: Commit and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: update dependencies"
          git pull --rebase
          git push
          gh workflow run deploy.yml --ref "$GITHUB_REF_NAME" ||
            echo "::warning::could not start deploy.yml; the scheduled deploy publishes this commit"
        env:
          GH_TOKEN: ${{ github.token }}
