# Once a week, raise the npm dependencies to their latest versions, but only
# keep the result if the site still builds. The checks are the ones deploy.yml
# runs: formatting, type check, generated docs, build, audit.
#
# Only versions at least seven days old are taken, so a freshly published (or
# hijacked) release is not built and deployed unseen: ncu picks the version and
# `npm install --before` stops the lockfile from resolving anything newer. The
# `update` job runs package code with a read-only token and no credentials. The
# `publish` job never runs package code: it takes the two changed files from the
# first job and is the only one that can write.
#
# The result goes into a pull request on the branch `dependency-update`, not onto
# the default branch, so you review the diff before it is published. Each run
# rebuilds that branch from the default branch. The repository setting "Allow
# GitHub Actions to create and approve pull requests" must be on. GITHUB_TOKEN
# pushes start no workflow, so the pull request has no build checks of its own:
# the update job has already run them, and deploy.yml can be run on the branch.
#
# Two attempts: every update including majors first, then minor and patch
# updates only. If neither passes, nothing is committed and the run says so.
# TypeScript stays out of the first attempt: astro check refuses TypeScript 7
# (see renovate.json).
#
# Uses GITHUB_TOKEN, not a PAT.
name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 2' # Tuesdays, 03:23 UTC

permissions:
  contents: read

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Update and verify
        run: |
          set -o pipefail
          verify() {
            npm ci &&
              npx prettier . --check &&
              npx astro check &&
              npm run docs:check &&
              npm run build 2>&1 | tee "$RUNNER_TEMP/build.log" &&
              ! grep -qE 'Invalid content reference|does not exist or is empty' "$RUNNER_TEMP/build.log" &&
              npm run audit
          }
          attempt() {
            git checkout -- package.json package-lock.json
            npx --yes npm-check-updates@23.1.0 --cooldown 7 -u "$@" &&
              npm install --before "$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" &&
              verify
          }
          if attempt --reject typescript; then
            echo "Updated all dependencies."
          elif attempt --target minor; then
            echo "Updated minor and patch versions; at least one major update breaks the build."
          else
            git checkout -- package.json package-lock.json
            echo "::warning::no dependency update passed the checks; nothing was changed"
          fi

      - name: Keep the result for the publish job
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No change."
            exit 0
          fi
          mkdir "$RUNNER_TEMP/out"
          cp package.json package-lock.json "$RUNNER_TEMP/out/"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        id: result

      - uses: actions/upload-artifact@v7
        if: steps.result.outputs.changed == 'true'
        with:
          name: dependency-update
          path: ${{ runner.temp }}/out

    outputs:
      changed: ${{ steps.result.outputs.changed }}

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Into its own directory, never the workspace: the artifact comes from a job
      # that ran package code, and anything it holds beyond the two files below
      # (a replaced script or workflow, say) is dropped, not extracted over the repository.
      - uses: actions/download-artifact@v8
        with:
          name: dependency-update
          path: ${{ runner.temp }}/artifact

      - name: Take the two dependency files from the artifact
        run: |
          [ "$(ls -A "$RUNNER_TEMP/artifact" | sort | tr '\n' ' ')" = "package-lock.json package.json " ] ||
            { echo "::error::the artifact holds more or less than the two dependency files"; exit 1; }
          cp "$RUNNER_TEMP/artifact/package.json" "$RUNNER_TEMP/artifact/package-lock.json" .

      # The artifact comes from a job that ran package code, so it is untrusted:
      # scripts/check-dependency-update.mjs, from the repository and not from the
      # artifact, parses both files and allows version changes only.
      - name: Check the artifact changes nothing but versions
        run: node scripts/check-dependency-update.mjs

      - name: Open or update the pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C dependency-update
          git add package.json package-lock.json
          git commit -m "chore: update dependencies"
          git push --force origin dependency-update
          if [ -z "$(gh pr list --head dependency-update --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head dependency-update \
              --title "chore: update dependencies" \
              --body "This pull request raises the npm dependencies. The update job ran the formatting check, type check, docs check, build and audit on this exact change. Review package.json and the lockfile, then merge to publish."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
