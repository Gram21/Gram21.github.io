# Refresh src/data/citations.yml from Google Scholar weekly, commit it, and
# redeploy the site.
#
# Runs every six hours, but the script skips the fetch while the data is younger
# than SCHOLAR_MIN_AGE_DAYS, so Scholar is asked once a week. Scholar
# rate-limits hard and has no API: a blocked or timed-out run is a success, and
# whatever Scholar did return is merged into the file (the rest keeps its last
# known count). `last_updated` moves only after a complete fetch, so an
# incomplete one is retried at the next run. The weekly mark then stops the
# retries.
#
# Uses GITHUB_TOKEN, not a PAT. Its push triggers no other workflow, so the
# last step starts deploy.yml explicitly (workflow_dispatch is the exception
# GITHUB_TOKEN may trigger). If that fails, the scheduled run of deploy.yml
# publishes the commit a few hours later. Needs scholar_userid in
# src/data/socials.yml.
name: Update Scholar citations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *' # every six hours, off the hour, when runners are busiest

permissions:
  contents: write
  actions: write

concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SCHOLAR_MIN_AGE_DAYS: ${{ github.event_name == 'schedule' && '7' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Fetch citations
        run: |
          set +e
          timeout --signal=TERM --kill-after=30 900 python -u scripts/update_scholar_citations.py
          code=$?
          # 124/137/143 are the timeout and its signals: Scholar rate-limited
          # us. Expected, not a failure — the script has already written
          # what it received; the next step commits it.
          if [ $code -eq 124 ] || [ $code -eq 137 ] || [ $code -eq 143 ]; then
            echo "Scholar did not answer in time."
            exit 0
          fi
          exit $code

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/citations.yml; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/citations.yml
          git commit -m "chore: refresh Scholar citations"
          git pull --rebase
          git push
          gh workflow run deploy.yml --ref "$GITHUB_REF_NAME" ||
            echo "::warning::could not start deploy.yml; the scheduled deploy publishes this commit"
        env:
          GH_TOKEN: ${{ github.token }}
