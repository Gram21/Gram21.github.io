# Refresh src/data/github-metadata.json from the GitHub API, commit it, and
# redeploy the site.
#
# Runs on demand and on a push to repositories.yml; uncomment the schedule below
# to add a weekly run. Uses GITHUB_TOKEN, not a PAT. Its push triggers no other
# workflow, so the last step starts deploy.yml explicitly; workflow_dispatch is
# the exception GITHUB_TOKEN may trigger.
name: Update GitHub metadata

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 3 * * 1' # Mondays, 03:00 UTC
  push:
    paths: [src/data/repositories.yml]
    branches: [master]

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fetch metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run data:github

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/github-metadata.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/github-metadata.json
          git commit -m "chore: refresh GitHub metadata"
          git push
          gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
